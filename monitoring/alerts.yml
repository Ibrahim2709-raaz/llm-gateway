groups:
  - name: llm-gateway-routing
    rules:
      - alert: LLMGatewayHighFailureRate
        expr: |
          sum(rate(llm_gateway_requests_total{outcome="failed"}[5m]))
          /
          clamp_min(sum(rate(llm_gateway_requests_total{outcome=~"success|failed"}[5m])), 1e-9)
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Gateway request failure rate is above 5%
          runbook_url: https://github.com/Ibrahim2709-raaz/llm-gateway/blob/main/docs/intelligent-routing-operations.md#gateway-or-provider-failures

      - alert: LLMGatewayProviderCircuitOpen
        expr: increase(llm_gateway_provider_attempts_total{outcome="circuit_open"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A provider circuit breaker is rejecting attempts
          runbook_url: https://github.com/Ibrahim2709-raaz/llm-gateway/blob/main/docs/intelligent-routing-operations.md#gateway-or-provider-failures

      - alert: LLMGatewayShadowEvaluationSkipped
        expr: increase(llm_gateway_shadow_decisions_total{result="skipped"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Intelligent-routing shadow evaluation is being skipped
          runbook_url: https://github.com/Ibrahim2709-raaz/llm-gateway/blob/main/docs/intelligent-routing-operations.md#shadow-evaluation-is-skipped

      - alert: LLMGatewayShadowLowAgreement
        expr: |
          sum(increase(llm_gateway_shadow_decisions_total{result="agreement"}[30m]))
          /
          clamp_min(sum(increase(llm_gateway_shadow_decisions_total{result=~"agreement|disagreement"}[30m])), 1)
          < 0.5
          and
          sum(increase(llm_gateway_shadow_decisions_total{result=~"agreement|disagreement"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Baseline and intelligent routes agree on fewer than half of shadow decisions
          runbook_url: https://github.com/Ibrahim2709-raaz/llm-gateway/blob/main/docs/intelligent-routing-operations.md#shadow-agreement-drops

      - alert: LLMGatewayRoutingConcentration
        expr: |
          max(sum by (provider, model) (rate(llm_gateway_intelligent_routes_total[15m])))
          /
          clamp_min(sum(rate(llm_gateway_intelligent_routes_total[15m])), 1e-9)
          > 0.9
          and
          sum(increase(llm_gateway_intelligent_routes_total[15m])) >= 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 90% of intelligent traffic is concentrated on one model
          runbook_url: https://github.com/Ibrahim2709-raaz/llm-gateway/blob/main/docs/intelligent-routing-operations.md#routing-concentration-increases
