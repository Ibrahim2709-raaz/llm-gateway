name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app

      - name: Test
        env:
          APP_ENV: test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Validate Prometheus rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring:/etc/prometheus/config:ro"
          prom/prometheus:v3.5.5
          check rules /etc/prometheus/config/alerts.yml

  container:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  end-to-end:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      COMPOSE_PROJECT_NAME: llm-gateway-ci-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start gateway and dependencies
        run: docker compose up --build --detach --wait gateway

      - name: Create smoke-test clients and exercise API
        shell: bash
        run: |
          primary_output="$(docker compose exec -T gateway llm-gateway-create-key --client-name ci-primary)"
          secondary_output="$(docker compose exec -T gateway llm-gateway-create-key --client-name ci-secondary)"
          primary_key="$(printf '%s\n' "$primary_output" | tail -n 1 | tr -d '\r')"
          secondary_key="$(printf '%s\n' "$secondary_output" | tail -n 1 | tr -d '\r')"
          primary_client_id="$(printf '%s\n' "$primary_output" | sed -n 's/^Client ID: //p' | tr -d '\r')"
          secondary_client_id="$(printf '%s\n' "$secondary_output" | sed -n 's/^Client ID: //p' | tr -d '\r')"
          test -n "$primary_key"
          test -n "$secondary_key"
          test -n "$primary_client_id"
          test -n "$secondary_client_id"
          echo "::add-mask::$primary_key"
          echo "::add-mask::$secondary_key"

          period="$(date -u +%Y-%m)"
          docker compose exec -T gateway llm-gateway-set-budget \
            --client-id "$primary_client_id" --period "$period" --limit-usd 1.25
          docker compose exec -T gateway llm-gateway-set-budget \
            --client-id "$secondary_client_id" --period "$period" --limit-usd 2.50

          python scripts/e2e_smoke.py \
            --api-key "$primary_key" \
            --secondary-api-key "$secondary_key" \
            --expected-budget-usd 1.25 \
            --secondary-expected-budget-usd 2.50

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
